name: spevnik
description: Spevník vyrobený na mieru pre Tatina
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.0.0
  cupertino_icons: ^1.0.8


dev_dependencies:
  flutter_launcher_icons: "^0.14.3"
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/songs.json
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/songbook-logo.png"